name: CI

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 11 은 Node 22.13+ 필요. Firebase Functions 런타임은 Node 20 이므로
          # CI 도 Node 20 유지. Node 20 과 호환되는 pnpm 10.x 사용.
          version: 10.34.5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # jsdom 30.x 는 undici 8.x 를 사용하고 이는 Node 21+ 의 webidl.util.markAsUncloneable
          # 을 요구. Node 20 에서는 packages/web 테스트가 "webidl.util.markAsUncloneable is
          # not a function" 로 실패. CI 는 Node 22 로 올려서 테스트만 검증. Firebase
          # Functions 배포 런타임은 여전히 Node 20 (packages/functions/package.json engines).
          node-version: '22.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm -r test

      - name: Emulator integration tests
        run: pnpm test:emu
