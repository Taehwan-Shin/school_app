name: CI

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 11 은 Node 22.13+ 필요. Firebase Functions 런타임은 Node 20 이므로
          # CI 도 Node 20 유지. Node 20 과 호환되는 pnpm 10.x 사용.
          version: 10.34.5

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm -r test

      - name: Emulator integration tests
        run: pnpm test:emu
