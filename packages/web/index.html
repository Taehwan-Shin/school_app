<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- v0.305: preconnect hints. TLS handshake + DNS 를 eager 시작해 첫 auth/API 응답 ~100~200ms 단축.
         Firebase (asia-northeast3 region) + Pretendard font CDN. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://asia-northeast3-school-app-5a636.cloudfunctions.net" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- v0.318: Lighthouse 대응. 단일 2MB woff2 → dynamic-subset (unicode-range 분할 · 화면에 쓰인 글자 subset 만 다운로드).
         media="print" + onload 로 render-blocking 해제 (font-display: swap · system font 로 먼저 그림). 버전 고정 v1.3.9. -->
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" /></noscript>
    <meta name="description" content="학교 Google Workspace 계정·그룹·클래스룸·챗방 관리 웹앱" />
    <title>학교 워크스페이스 관리</title>
  </head>
  <body class="bg-canvas text-fg-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
